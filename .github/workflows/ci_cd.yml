name: FreshChain AI CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # Job 1: Linting, Schema Validation, and Automated Unit Tests
  test-and-validate:
    name: Lint, Validate & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Upgrade Pip & Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 httpx

      - name: Syntax & Code Linting
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,mlruns
          # Exit-zero treat all errors as warnings
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics --exclude=.venv,mlruns

      - name: Train Champion Model on Runner Environment
        run: |
          python ml/train.py

      - name: Run Automated Pytest Suite
        run: |
          pytest -v --tb=short

  # Job 2: Build & Validate Docker Container
  build-container:
    name: Build Multi-Stage Docker Image
    needs: test-and-validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Load Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          load: true
          tags: freshchain-ai:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Container Execution & In-Container Prediction
        run: |
          echo "[1/4] Starting container in background..."
          docker run -d -p 8000:8000 --name freshchain-test freshchain-ai:latest
          
          echo "[2/4] Waiting 6 seconds for container startup..."
          sleep 6
          docker ps
          
          echo "[3/4] Verifying HTTP healthcheck and prediction inside container..."
          curl -f http://localhost:8000/api/health
          curl -f -X POST http://localhost:8000/api/predict \
            -H "Content-Type: application/json" \
            -d '{"fruit": "Tomato", "temperature_c": 22.0, "humidity_pct": 85.0, "light_lux": 10.0, "co2_ppm": 340.0, "quantity_kg": 500, "price_per_kg": 1.5}'
            
          echo "[4/4] Verifying ETL execution works inside container..."
          docker exec freshchain-test python etl/run_pipeline.py
          
          echo "All in-container execution tests passed!"
          docker stop freshchain-test

  # Job 3: Optional Cloud Deployment (Gated by Azure Credentials Secret)
  deploy-cloud:
    name: Deploy to Azure (Optional)
    needs: [test-and-validate, build-container]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Check Cloud Deployment Secrets
        id: check-secrets
        run: |
          if [ -n "${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}" ]; then
            echo "has_azure_secret=true" >> $GITHUB_OUTPUT
            echo "[INFO] Azure publish profile detected. Proceeding to deploy."
          else
            echo "has_azure_secret=false" >> $GITHUB_OUTPUT
            echo "[INFO] No Azure deployment secrets configured. Skipping cloud push to protect student credit."
          fi

      - name: Deploy to Azure Web App / Functions
        if: steps.check-secrets.outputs.has_azure_secret == 'true'
        uses: azure/webapps-deploy@v2
        with:
          app-name: freshchain-api
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
